<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="buttonContainer">
                <button onclick="pucharAPI1()">ver valores</button>
                <button onclick="pucharAPI3()">Atualizar imagem</button>
                <button onclick="apagarImg()">tirar imagem</button>
            </div>
            <div class="conteudoContainer">
                <img src="" alt="imagem aleatoria" id="imgDog">
                <hr>
                <h1>valores</h1>
                <div class="inputContainer">
                    <label for="inputDolar">valor do dolar</label>
                    <input type="text" id="inputDolar" readonly>
                </div>
                <hr>
                <div class="inputContainer">
                    <label for="inputpais">pais</label>
                    <input type="text" id="inputpais">
                    <label for="bandeira">bandeira</label>
                    <img src="" alt="imgem bandeira" id="bandeira">
                    <label for="inputcapital">Capital</label>
                    <input type="text" id="inputcapital" readonly>
                    <label for="inputpopulacao">populacao</label>
                    <input type="text" id="inputpopulacao" readonly>
                </div>
                <hr>
                <h1>Clima</h1>
                <div class="inputContainer">
                    <label for="inputKey">OpenWeader key</label>
                    <input type="text" id="inputKey" placeholder="Escreva sua key OpenWeader">
                    <label for="inputCidade">Cidade</label>
                    <input type="text" id="inputCidade" placeholder="Escreva a cidade">
                </div>
                <button onclick="pucharAPI4()">Confirmar key</button>
                <div class="inputContainer">
                    <label for="inputClima">Clima</label>
                    <input type="text" id="inputClima" readonly>
                    <label for="imgClima">Clima</label>
                    <img src="" alt="imgem clima" id="imgClima">
                    <label for="tempMax">Temp-max</label>
                    <input type="text" id="tempMax" readonly>
                    <label for="tempMim">Temp-mim</label>
                    <input type="text" id="tempMim" readonly>
                    <label for="speedVento">Velocidade Vento</label>
                    <input type="text" id="speedVento" readonly>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
